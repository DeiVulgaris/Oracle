<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oracle: Flip & Resonance</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #030303; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        #oracle-element {
            font-weight: 800; 
            text-transform: uppercase; 
            text-align: center;
            opacity: 0; 
            display: none;
            line-height: 1;
        }
        .yes { color: #ff3b30; text-shadow: 0 0 25px rgba(255, 59, 48, 0.4); }
        .no { color: #8e8e93; text-shadow: 0 0 25px rgba(142, 142, 145, 0.2); }
        .maybe { color: #007aff; text-shadow: 0 0 25px rgba(0, 122, 255, 0.4); }
        #hint {
            position: absolute; font-size: 0.8rem; color: #444;
            bottom: 40px; text-align: center; width: 100%; letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="oracle-element"></div>
    <div id="hint">ТАПНИ ДЛЯ АКТИВАЦИИ ЛОГОСА</div>

    <script>
        const element = document.getElementById('oracle-element');
        const hint = document.getElementById('hint');

        // СИНХРОНИЗАЦИЯ: Паттерны вибрации под жесты персонажа (ТЗ 1.5)
        const answers = [
            { text: 'ДА', type: 'yes', vibe: [1000] }, // 1 длинный плотный кивок (1 секунда)
            { text: 'НЕТ', type: 'no', vibe: [150, 150, 150, 150, 150] }, // 3 хлестких отсечки (скрещение рук/палец)
            { text: 'НЕ ОПРЕДЕЛЕНО', type: 'maybe', vibe: [150, 250, 800] } // Маркер-вопрос + зависание + шлейф плеч
        ];

        let isReady = false; 
        let isShowing = false; 
        let nextAnswer = null;
        let sensorsActivated = false;

        function runVibration(pattern) {
            if ("vibrate" in navigator) navigator.vibrate(pattern);
        }

        function bakeAnswer() {
            isReady = true;
            const rand = Math.random();
            if (rand < 0.45) nextAnswer = answers[0];
            else if (rand < 0.90) nextAnswer = answers[1];
            else nextAnswer = answers[2];

            // Визуальный и тактильный фидбек запекания (короткий отклик на Android)
            hint.innerText = "ОРАКУЛ СЛУШАЕТ...";
            hint.style.color = "#ff3b30";
            runVibration(40);
        }

        function triggerShow() {
            if (!nextAnswer) return;

            element.innerText = nextAnswer.text;
            element.className = nextAnswer.type;
            element.style.display = 'block';
            element.style.transition = 'none';
            element.style.fontSize = '0rem';
            element.style.opacity = '0';

            // Синестетический старт звука/вибро строго в миг взрыва
            runVibration(nextAnswer.vibe);

            requestAnimationFrame(() => {
                // Взрывное вспухание до 150% через кубическое Безье (эффект Bounce)
                element.style.transition = 'font-size 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s ease';
                element.style.fontSize = '6.5rem';
                element.style.opacity = '1';

                setTimeout(() => {
                    // Возврат к стабильным 100% за 0.15 сек
                    element.style.transition = 'font-size 0.15s ease-out';
                    element.style.fontSize = '4.5rem';
                }, 150);
            });

            // ФАЗА СТАТИКИ: Жесткие 2.0 секунды удержания формы без изменений
            setTimeout(() => {
                // ФАЗА ТАЯНИЯ: Ровно 3.0 секунды плавного исчезновения цвета на месте (шрифт статичен)
                element.style.transition = 'opacity 3.0s linear';
                element.style.opacity = '0';

                setTimeout(() => {
                    element.style.display = 'none';
                    nextAnswer = null; 
                    isShowing = false;
                    hint.innerText = "ПОЛОЖИ ЭКРАНОМ ВНИЗ";
                    hint.style.color = "#444";
                    hint.style.opacity = "1";
                }, 3000);

            }, 2300); // 300мс вспухание + 2000мс удержание
        }

        // --- МОНИТОРИНГ ДАТЧИКОВ ПОЛОЖЕНИЯ ---
        function handleOrientation(e) {
            if (!sensorsActivated) return;

            let beta = e.beta; 
            let gamma = e.gamma;
            
            if (beta === null || gamma === null) return;

            // Расширенная калибровка триггеров под удержание в руке
            let isFaceDown = Math.abs(beta) > 155 || (Math.abs(gamma) > 65 && beta < 0);
            let isFaceUp = Math.abs(beta) < 35 && Math.abs(gamma) < 35;

            if (isFaceDown && !isReady && !isShowing) {
                bakeAnswer();
            } 
            else if (isFaceUp && isReady && !isShowing) {
                isShowing = true; 
                isReady = false;
                hint.style.opacity = '0';
                // ТАКТ 2: Ровно 1 секунда удержания экрана вверх перед вспуханием
                setTimeout(triggerShow, 1000);
            }
        }

        // Инициализация датчиков при клике (универсальный кроссплатформенный метод)
        window.addEventListener('click', () => {
            if (sensorsActivated) return;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Логика для iOS (Safari)
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            sensorsActivated = true;
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            hint.innerText = "КЛАДИ ЭКРАНОМ ВНИЗ";
                            runVibration(60);
                        } else {
                            hint.innerText = "ДОСТУП К ДАТЧИКАМ ОТКЛОНЕН";
                        }
                    })
                    .catch(console.error);
            } else {
                // Логика для Android (Chrome) и десктопных браузеров
                sensorsActivated = true;
                window.addEventListener('deviceorientation', handleOrientation, true);
                hint.innerText = "КЛАДИ ЭКРАНОМ ВНИЗ";
                runVibration(60);
            }
        });
    </script>
</body>
</html>
