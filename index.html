<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oracle: Flip & Resonance</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #030303; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        #oracle-text {
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transform: scale(0);
            display: none;
        }

        /* Цветовой Логос из ТЗ */
        .yes { color: #ff3b30; text-shadow: 0 0 25px rgba(255, 59, 48, 0.4); } /* Красный */
        .no { color: #8e8e93; text-shadow: 0 0 25px rgba(142, 142, 145, 0.2); }  /* Серый */
        .maybe { color: #007aff; text-shadow: 0 0 25px rgba(0, 122, 255, 0.4); } /* Синий */

        #hint {
            position: absolute; font-size: 0.8rem; color: #333;
            bottom: 40px; text-align: center; width: 100%; letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="oracle-text"></div>
    <div id="hint">ТАПНИ ДЛЯ АКТИВАЦИИ И ПОЛОЖИ ЭКРАНОМ ВНИЗ</div>

    <script>
        const textElement = document.getElementById('oracle-text');
        const hintElement = document.getElementById('hint');

        // База данных Триады (Смысл - Вибро-паттерны под жесты)
        const answers = [
            { 
                text: 'ДА', 
                type: 'yes', 
                vibe: [1000] // 1 длинный плотный сигнал (Утвердительный кивок)
            },
            { 
                text: 'НЕТ', 
                type: 'no', 
                vibe: [150, 150, 150, 150, 150] // 3 резких удара под отсечки пальца/рук
            },
            { 
                text: 'НЕ ОПРЕДЕЛЕНО', 
                type: 'maybe', 
                vibe: [150, 250, 800] // Короткий вопрос + пауза + уходящий шлейф плеч
            }
        ];

        let isReady = false;
        let isShowing = false;
        let nextAnswer = null;

        // Синхронизированный вибро-движок
        function runVibration(pattern) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function bakeAnswer() {
            isReady = true;
            const rand = Math.random();
            if (rand < 0.45) nextAnswer = answers[0];      // ДА (45%)
            else if (rand < 0.90) nextAnswer = answers[1]; // НЕТ (45%)
            else nextAnswer = answers[2];                  // НЕ ОПРЕДЕЛЕНО (10%)
        }

        function triggerShow() {
            if (!nextAnswer) return;

            // Инициализация параметров перед вспышкой
            textElement.innerText = nextAnswer.text;
            textElement.className = nextAnswer.type;
            textElement.style.display = 'block';
            textElement.style.transition = 'none'; 
            textElement.style.fontSize = '0rem';
            textElement.style.opacity = '0';

            // Синхронный тактильный старт
            runVibration(nextAnswer.vibe);

            // ТАКТ 3: Взрывное вспухание (0 -> 150% -> 100% за 0.3 секунды)
            requestAnimationFrame(() => {
                // Использование кубического Безье для имитации физики отскока (Bounce)
                textElement.style.transition = 'font-size 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.3), opacity 0.15s ease';
                textElement.style.fontSize = '6.5rem'; // Пик вспухания (150%)
                textElement.style.opacity = '1';

                setTimeout(() => {
                    textElement.style.transition = 'font-size 0.15s ease-out';
                    textElement.style.fontSize = '4.5rem'; // Возврат к эталонным 100%
                }, 150);
            });

            // ФАЗА СТАТИКИ: Замирает без изменений ровно на 2 секунды
            setTimeout(() => {
                // ФАЗА ТАЯНИЯ: 3 секунды медленно растворяется на месте, размер шрифта статичен
                textElement.style.transition = 'opacity 3.0s linear';
                textElement.style.opacity = '0';

                setTimeout(() => {
                    textElement.style.display = 'none';
                    nextAnswer = null;
                    isShowing = false;
                    hintElement.style.opacity = '1';
                    hintElement.innerText = "ПОЛОЖИ ЭКРАНОМ ВНИЗ ДЛЯ НОВОГО ВОПРОСА";
                }, 3000);

            }, 2300); // 300мс вспухание + 2000мс чтение
        }

        // --- ДАТЧИКИ ПОЛОЖЕНИЯ (FACE DOWN / FACE UP) ---
        window.addEventListener('deviceorientation', (e) => {
            let beta = e.beta;   // Наклон продольный (-180 до 180)
            let gamma = e.gamma; // Наклон поперечный (-90 до 90)

            if (beta === null) return;

            // Триггер Face Down (Экран лежит на столе/повернут к полу)
            let isFaceDown = Math.abs(beta) > 155 || (Math.abs(gamma) > 65 && beta < 0);
            
            // Триггер Face Up (Экран поднят к лицу/смотрит вверх)
            let isFaceUp = Math.abs(beta) < 35 && Math.abs(gamma) < 35;

            if (isFaceDown && !isReady && !isShowing) {
                bakeAnswer();
                hintElement.innerText = "ОРАКУЛ СЛУШАЕТ... ЗАПЕКАНИЕ ОТВЕТА";
                hintElement.style.opacity = '0.2';
            } 
            else if (isFaceUp && isReady && !isShowing) {
                isShowing = true;
                isReady = false;
                hintElement.style.opacity = '0';
                // ТАКТ 2: Ровно 1.0 секунда паузы стабилизации перед взрывом
                setTimeout(triggerShow, 1000);
            }
        });

        // Первая принудительная активация для iOS/Android политик безопасности
        window.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') { hintElement.innerText = "ДОСТУП ЕСТЬ. КЛАДИ ЭКРАНОМ ВНИЗ"; }
                }).catch(console.error);
            } else {
                // Для браузеров без жестких ограничений прав датчиков
                if (!isShowing && !isReady) {
                    hintElement.innerText = "ДАТЧИКИ АКТИВНЫ. КЛАДИ ЭКРАНОМ ВНИЗ";
                }
            }
        });
    </script>
</body>
</html>
